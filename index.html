<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <link rel="preconnect" href="https://assets.mixkit.co">
    <link rel="dns-prefetch" href="https://assets.mixkit.co">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" media="print" onload="this.media='all'">
    <title>黑金跃动留声机</title>
    <style>
        * { box-sizing: border-box; }

        html {
            height: 100%;
            background: #0a0806;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #2c241b 0%, #0a0806 80%, #000000 100%);
            font-family: 'Playfair Display', 'Georgia', 'Songti SC', 'SimSun', serif;
            overflow: hidden;
            perspective: 1200px;
        }

        /* 中轴线跃动特效 */
        .rhythm-line {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scaleX(0.7);
            transform-origin: center center;
            width: 600px;
            height: 3px;
            background: linear-gradient(to right, transparent, #d4af37 8%, #d4af37 92%, transparent);
            box-shadow: 0 0 20px #d4af37, 0 0 40px #d4af37;
            transition: opacity 0.1s linear;
            will-change: transform, opacity;
            opacity: 0.3;
            z-index: 1; /* 放在唱片后面 */
        }

        /* 歌词显示区：放在屏幕左侧 */
        .lyrics-container {
            position: absolute;
            left: 10%;
            top: 50%;
            transform: translateY(-50%);
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: right;
            pointer-events: none;
            z-index: 10;
        }

        .lyric-line {
            color: rgba(201, 185, 154, 0.4);
            font-size: 16px;
            font-style: italic;
            transition: all 0.5s ease;
        }

        /* 当前高亮的歌词 */
        .lyric-line.active {
            color: #d4af37;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            transform: translateX(-10px);
        }

        .scene {
            position: relative;
            width: 340px;
            height: 340px;
            transform-style: preserve-3d;
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 5;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-radial-gradient(#111, #111 2px, #1a1a1a 3px, #111 4px);
            border: 4px solid #8a6d3b;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 0, 0, 1), 0 0 40px rgba(138, 109, 59, 0.2);
            transform: rotateX(55deg) rotateY(0deg) rotateZ(0deg);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .label {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 50%, #6b4c0a 100%);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 0 0 10px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            animation: spin 6s linear infinite;
            animation-play-state: paused;
            border: 1px solid #fceabb;
        }

        .hole {
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
        }

        .label::after {
            content: "Harmonia";
            color: #2c1e00;
            font-size: 13px;
            font-weight: 700;
            font-style: italic;
            position: absolute;
            bottom: 18px;
            letter-spacing: 2px;
        }

        .tonearm {
            position: absolute;
            top: -30px;
            right: -45px;
            width: 14px;
            height: 220px;
            background: linear-gradient(to right, #5c4013, #d4af37, #ffdf73, #8a6d3b);
            border-radius: 4px;
            transform-origin: top center;
            transform: rotateZ(28deg) rotateX(-55deg);
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 10px 25px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .tonearm::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: -2px;
            width: 18px;
            height: 30px;
            background: #1a1a1a;
            border-radius: 2px;
            border: 1px solid #d4af37;
        }

        @keyframes spin {
            100% { transform: rotateZ(360deg); }
        }

        /* ============ 右侧唱片架 ============ */
        .library {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            width: 250px;
            max-height: 64vh;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px 14px;
            border: 1px solid rgba(138, 109, 59, 0.25);
            background: linear-gradient(160deg, rgba(28, 23, 16, 0.72), rgba(12, 10, 7, 0.5));
            z-index: 15;
            opacity: 0.92;
            transition: opacity 0.4s ease, border-color 0.4s ease;
        }

        .library:hover {
            opacity: 1;
            border-color: rgba(212, 175, 55, 0.35);
        }

        .library-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            padding-bottom: 9px;
            border-bottom: 1px solid rgba(138, 109, 59, 0.2);
            font-size: 12px;
            letter-spacing: 0.18em;
            color: #8a6d3b;
            text-transform: uppercase;
        }

        .library-title {
            color: #c9b99a;
            font-style: italic;
            font-size: 13px;
            letter-spacing: 0.12em;
        }

        .library-count {
            font-size: 11px;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .library-hint {
            padding: 26px 6px;
            color: rgba(201, 185, 154, 0.35);
            font-size: 12px;
            font-style: italic;
            line-height: 2;
            text-align: center;
        }

        .library-hint strong {
            display: block;
            color: rgba(212, 175, 55, 0.55);
            font-weight: 400;
            letter-spacing: 0.08em;
        }

        .track-list {
            list-style: none;
            margin: 0;
            padding: 0 2px 0 0;
            overflow-y: auto;
            flex: 1;
            min-height: 0;
            scrollbar-width: thin;
            scrollbar-color: rgba(138, 109, 59, 0.45) transparent;
        }

        .track-list::-webkit-scrollbar { width: 4px; }
        .track-list::-webkit-scrollbar-thumb { background: rgba(138, 109, 59, 0.4); border-radius: 2px; }

        .track-item {
            display: flex;
            align-items: baseline;
            gap: 9px;
            padding: 7px 8px;
            border-left: 1px solid transparent;
            color: rgba(201, 185, 154, 0.55);
            font-size: 12.5px;
            cursor: pointer;
            transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        .track-item:hover {
            background: rgba(212, 175, 55, 0.06);
            color: #c9b99a;
        }

        .track-item.active {
            color: #d4af37;
            border-left-color: #d4af37;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.13), transparent);
        }

        .track-index {
            min-width: 18px;
            font-size: 10px;
            font-style: normal;
            color: rgba(138, 109, 59, 0.75);
            letter-spacing: 0.05em;
        }

        .track-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .track-item.active .track-name {
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.45);
        }

        .track-item.more {
            cursor: default;
            color: rgba(138, 109, 59, 0.6);
            font-size: 11px;
            font-style: italic;
            border-left-color: transparent;
            background: none;
        }

        /* 底部控制区 */
        .controls {
            position: absolute;
            bottom: 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 13px;
            z-index: 20;
            width: 100%;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 18px;
            width: min(460px, 90vw);
            color: #c9b99a;
            font-size: 14px;
            font-style: italic;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(138, 109, 59, 0.3);
        }

        #song-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #time-display {
            flex-shrink: 0;
            font-size: 12px;
            color: #8a6d3b;
            font-variant-numeric: tabular-nums;
        }

        .progress {
            position: relative;
            width: min(460px, 90vw);
            height: 2px;
            background: rgba(138, 109, 59, 0.22);
            cursor: pointer;
            transition: height 0.2s ease;
        }

        .progress:hover { height: 4px; }

        .progress-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0;
            background: linear-gradient(90deg, #8a6d3b, #d4af37, #ffdf73);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.45);
        }

        .progress::after {
            content: "";
            position: absolute;
            top: -8px;
            bottom: -8px;
            left: 0;
            right: 0;
        }

        input[type="file"] {
            display: none;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 4px;
        }

        button, .file-label {
            padding: 9px 20px;
            background: transparent;
            color: #d4af37;
            font-size: 15px;
            font-family: 'Playfair Display', 'Songti SC', serif;
            cursor: pointer;
            border: 1px solid #8a6d3b;
            transition: all 0.4s ease;
            white-space: nowrap;
            user-select: none;
        }

        button:hover, .file-label:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        button:disabled {
            opacity: 0.32;
            cursor: default;
            background: transparent;
            border-color: #6b5430;
            box-shadow: none;
        }

        button:focus-visible, .file-label:focus-visible, .track-item:focus-visible {
            outline: 1px solid #d4af37;
            outline-offset: 3px;
        }

        #shuffle-btn.on {
            color: #1a1206;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            border-color: #d4af37;
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.35);
        }

        .shortcut-hint {
            font-size: 10.5px;
            letter-spacing: 0.14em;
            color: rgba(138, 109, 59, 0.6);
            font-style: italic;
        }

        .status {
            position: absolute;
            left: 50%;
            top: 40px;
            transform: translateX(-50%);
            max-width: 86vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #8a6d3b;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            transition: color 0.4s ease;
            z-index: 30;
        }

        .credit {
            margin-top: 2px;
            font-size: 10px;
            letter-spacing: 0.06em;
            color: rgba(160, 132, 82, 0.8);
            font-style: italic;
            text-align: center;
        }

        .credit a {
            color: rgba(201, 185, 154, 0.7);
            text-decoration: none;
            border-bottom: 1px dotted rgba(138, 109, 59, 0.5);
        }

        .credit a:hover { color: #d4af37; }

        .credit[hidden] { display: none; }

        /* 拖入文件夹提示层 */
        .drop-veil {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(5, 4, 3, 0.72);
            border: 2px dashed rgba(212, 175, 55, 0.45);
            color: #d4af37;
            font-size: 16px;
            letter-spacing: 0.28em;
            pointer-events: none;
        }

        .drop-veil.show { display: flex; }

        /* 轻提示 */
        .toast {
            position: absolute;
            left: 50%;
            top: 84px;
            transform: translate(-50%, -8px);
            z-index: 40;
            padding: 8px 18px;
            border: 1px solid rgba(138, 109, 59, 0.4);
            background: rgba(10, 8, 6, 0.85);
            color: #d4af37;
            font-size: 12.5px;
            letter-spacing: 0.1em;
            font-style: italic;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease, transform 0.35s ease;
            white-space: nowrap;
            max-width: 86vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @media (max-width: 1180px) {
            .lyrics-container { display: none; }
        }

        @media (max-width: 1000px) {
            .library { display: none; }
        }

        @media (max-height: 760px) {
            .scene { width: 280px; height: 280px; }
            .controls { bottom: 24px; gap: 10px; }
            .toast { bottom: 165px; }
        }

        @media (max-width: 720px) {
            .scene { width: 240px; height: 240px; }
            .tonearm { height: 165px; right: -30px; top: -22px; }
            .label { width: 86px; height: 86px; }
            .label::after { font-size: 11px; bottom: 13px; letter-spacing: 1px; }
            .status { top: 22px; font-size: 12px; letter-spacing: 2px; }
            .info-bar { font-size: 12px; }
            .btn-group { gap: 7px; }
            button, .file-label { padding: 8px 12px; font-size: 12.5px; }
            .toast { bottom: 170px; font-size: 11.5px; }
        }
    </style>
</head>

    <div class="status" id="status-text">— Awaiting Masterpiece —</div>

    <!-- 跃动横线 -->
    <div class="rhythm-line" id="rhythm-line"></div>

    <!-- 歌词区 -->
    <div class="lyrics-container" id="lyrics-container">
        <div class="lyric-line active">正在等待音乐的旋律...</div>
        <div class="lyric-line">让这跃动的音符</div>
        <div class="lyric-line">顺着这中轴线</div>
        <div class="lyric-line">滑入你的梦境</div>
    </div>

    <!-- 右侧唱片架 -->
    <aside class="library" id="library" aria-label="音乐库">

            <span class="library-count" id="library-count">0 首</span>

    <div class="controls">

            <button id="shuffle-btn" class="on" aria-pressed="true" title="随机播放 (S)">随机 · 开</button>
        </div>
        <div class="shortcut-hint">空格 播放 · ← → 切歌 · S 随机</div>
        <div class="credit" id="credit" hidden>Music from <a href="https://mixkit.co/free-stock-music/" target="_blank" rel="noopener">Mixkit</a> · <a href="https://mixkit.co/license/" target="_blank" rel="noopener">Free License</a></div>
    </div>

    <audio id="audio-player" preload="auto"></audio>
    <audio id="preloader" preload="auto" style="display:none"></audio>

    <div class="drop-veil" id="drop-veil">松开鼠标 · 载入音乐库</div>

    <script>
    (() => {
        'use strict';

        const AUDIO_RE = /\.(mp3|flac|wav|wave|ogg|oga|m4a|aac|opus|wma|aif|aiff|ape|webm)$/i;
        const MAX_RENDERED = 2000; // 唱片架最多渲染这么多行，随机仍覆盖整个曲库

        const $ = (id) => document.getElementById(id);
        const els = {
            scene: $('scene'), label: $('label'), tonearm: $('tonearm'),
            playBtn: $('play-btn'), prevBtn: $('prev-btn'), nextBtn: $('next-btn'),
            shuffleBtn: $('shuffle-btn'),
            status: $('status-text'), folderInput: $('folder-input'),
            audio: $('audio-player'), preloader: $('preloader'), songTitle: $('song-title'),
            timeDisplay: $('time-display'),
            rhythm: $('rhythm-line'),
            progress: $('progress'), progressFill: $('progress-fill'),
            trackList: $('track-list'), libraryCount: $('library-count'),
            libraryHint: $('library-hint'), toast: $('toast'),
            dropVeil: $('drop-veil'),
            credit: $('credit')
        };

        const state = {
            tracks: [],       // { title, remote, filename/file, path, seconds, bpm, broken }
            deck: [],         // 洗好的播放顺序（下标）
            deckPos: -1,
            current: -1,
            history: [],
            shuffle: true,
            objectUrl: null,
            libraryName: '',
            errorStreak: 0,
            online: false,
            hasPlayed: false
        };

        let rafId = null;
        let toastTimer = 0;

        /* ---------------- 小工具 ---------------- */

        function fmt(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        function toast(message) {
            els.toast.textContent = message;
            els.toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2600);
        }

        function setStatus(text, color) {
            els.status.textContent = text;
            els.status.style.color = color || '#8a6d3b';
        }

        function shuffleInPlace(list) {
            for (let i = list.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [list[i], list[j]] = [list[j], list[i]];
            }
            return list;
        }

        function filePath(file) {
            if (file.webkitRelativePath) return file.webkitRelativePath;
            if (file._relativePath) return String(file._relativePath).replace(/^\//, '');
            return file.name;
        }

        /* ---------------- 唱片架渲染 ---------------- */

        function renderLibrary() {
            const total = state.tracks.length;
            els.libraryCount.textContent = total ? `${total} 首` : '0 首';
            els.libraryHint.hidden = total > 0;
            els.trackList.hidden = total === 0;
            els.trackList.textContent = '';

            if (!total) return;

            const fragment = document.createDocumentFragment();
            const shown = Math.min(total, MAX_RENDERED);

            for (let i = 0; i < shown; i++) {
                const track = state.tracks[i];
                const li = document.createElement('li');
                li.className = 'track-item';
                li.dataset.index = String(i);
                li.title = track.remote
                    ? `${fmt(track.seconds)} · ${track.artist || 'Mixkit'}`
                    : track.path;

                const num = document.createElement('span');
                num.className = 'track-index';
                num.textContent = String(i + 1).padStart(2, '0');

                const name = document.createElement('span');
                name.className = 'track-name';
                name.textContent = track.title;

                li.append(num, name);
                li.addEventListener('click', () => {
                    if (i === state.current) {
                        els.audio.currentTime = 0;
                        startPlayback();
                    } else {
                        playIndex(i, true);
                    }
                });
                fragment.appendChild(li);
            }

            els.trackList.appendChild(fragment);

            if (total > shown) {
                const more = document.createElement('li');
                more.className = 'track-item more';
                more.textContent = `… 仅显示前 ${shown} 首，随机仍覆盖全部`;
                els.trackList.appendChild(more);
            }
        }

        function markActive(index) {
            for (const li of els.trackList.children) {
                if (li.dataset.index !== undefined) {
                    li.classList.toggle('active', li.dataset.index === String(index));
                }
            }
            const active = els.trackList.querySelector('.track-item.active');
            if (active) active.scrollIntoView({ block: 'center' });
        }

        /* ---------------- 播放顺序 ---------------- */

        function rebuildDeck() {
            state.deck = shuffleInPlace(state.tracks.map((_, i) => i));
            state.deckPos = -1;
            // 避免洗完一轮后立刻重播刚结束的那一首
            if (state.deck.length > 1 && state.deck[0] === state.current) {
                [state.deck[0], state.deck[1]] = [state.deck[1], state.deck[0]];
            }
        }

        function step(dir) {
            const total = state.tracks.length;
            if (!total) { promptLibrary(); return; }

            if (dir > 0) {
                if (state.shuffle) {
                    if (state.deck.length !== total) rebuildDeck();
                    if (state.deckPos + 1 >= state.deck.length) {
                        rebuildDeck();
                        toast('一轮播完，重新洗牌');
                    }
                    state.deckPos += 1;
                    playIndex(state.deck[state.deckPos], true);
                } else {
                    let next = state.current;
                    for (let k = 0; k < total; k++) {
                        next = (next + 1) % total;
                        if (!state.tracks[next].broken) break;
                    }
                    playIndex(next, true);
                }
                return;
            }

            // 上一首
            const prev = state.history.pop();
            if (prev !== undefined && prev !== state.current) {
                if (state.shuffle) {
                    const pos = state.deck.indexOf(prev);
                    if (pos !== -1) state.deckPos = pos;
                }
                playIndex(prev, true, false);
            } else {
                els.audio.currentTime = 0;
                if (els.audio.paused) startPlayback();
            }
        }

        function playIndex(index, autoplay = true, record = true) {
            if (index < 0 || index >= state.tracks.length) return;
            stopPreload();
            const track = state.tracks[index];
            const previousUrl = state.objectUrl;
            state.objectUrl = null;

            if (record && state.current !== -1) {
                state.history.push(state.current);
                if (state.history.length > 200) state.history.shift();
            }

            state.current = index;
            stopRhythm();

            let src;
            if (track.remote) {
                src = track.url;
            } else {
                state.objectUrl = URL.createObjectURL(track.file);
                src = state.objectUrl;
            }
            els.audio.src = src;
            if (previousUrl) URL.revokeObjectURL(previousUrl);

            els.songTitle.textContent = track.title;
            els.timeDisplay.textContent = `0:00 / ${fmt(track.seconds)}`;
            els.progressFill.style.width = '0%';
            els.progress.setAttribute('aria-valuenow', '0');
            document.title = `${track.title} · 黑金跃动留声机`;

            markActive(index);
            updateMediaSession(track);

            if (autoplay) {
                startPlayback();
            } else {
                setStatus('— Ready —');
            }
        }

        function nextTrackIndex() {
            if (!state.tracks.length) return -1;
            if (state.shuffle) {
                if (state.deck.length !== state.tracks.length) return -1;
                return state.deck[state.deckPos + 1] !== undefined ? state.deck[state.deckPos + 1] : -1;
            }
            return (state.current + 1) % state.tracks.length;
        }

        function stopPreload() {
            els.preloader.pause();
            els.preloader.removeAttribute('src');
            els.preloader.dataset.url = '';
            try { els.preloader.load(); } catch (err) { /* ignore */ }
        }

        // 等当前这首基本缓冲完，再预取下一首，避免和正在播放的音频抢带宽
        function preloadNextTrack() {
            if (!state.online) return;
            const index = nextTrackIndex();
            if (index < 0) return;
            const track = state.tracks[index];
            if (!track || !track.remote || !track.url) return;
            if (els.preloader.dataset.url === track.url) return;
            els.preloader.dataset.url = track.url;
            els.preloader.src = track.url;
            try { els.preloader.load(); } catch (err) { /* ignore */ }
        }

        function maybePreloadNext() {
            if (!state.online || els.audio.paused) return;
            const duration = els.audio.duration;
            if (!Number.isFinite(duration) || duration <= 0) return;
            const buffered = els.audio.buffered;
            if (!buffered.length) return;
            if (buffered.end(buffered.length - 1) < duration - 2) return;
            preloadNextTrack();
        }

        function startPlayback() {
            if (!state.tracks.length) { promptLibrary(); return; }
            if (state.current === -1) { step(1); return; }

            const promise = els.audio.play();
            if (!promise) return;
            promise.catch((err) => {
                if (err.name === 'NotAllowedError') {
                    setStatus('— 轻触任意处开始 —', '#d4af37');
                } else if (err.name === 'AbortError') {
                    // 切歌时被新的加载打断，忽略
                } else {
                    setStatus('— 无法播放 —');
                    toast('播放失败：' + (err.message || '未知错误'));
                }
            });
        }

        function promptLibrary() {
            toast('先载入一个本地音乐文件夹');
            els.folderInput.click();
        }

        /* ---------------- 跃动效果（按 BPM 打拍子） ---------------- */

        function startRhythm() {
            if (rafId) return;
            const track = state.tracks[state.current];
            const bpm = track && track.bpm ? track.bpm : 100;
            const period = 60 / Math.min(200, Math.max(40, bpm));
            const startedAt = performance.now();

            const tick = () => {
                rafId = requestAnimationFrame(tick);
                const phase = (((performance.now() - startedAt) / 1000) % period) / period;
                const env = Math.exp(-phase * 6);
                const scale = 0.7 + env * 0.3;
                els.rhythm.style.transform = `translate(-50%, -50%) scaleX(${scale.toFixed(3)})`;
                els.rhythm.style.opacity = (0.3 + env * 0.55).toFixed(2);
            };
            tick();
        }

        function stopRhythm() {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = null;
            els.rhythm.style.transform = 'translate(-50%, -50%) scaleX(0.7)';
            els.rhythm.style.opacity = '0.3';
        }

        /* ---------------- 界面状态 ---------------- */

        function setPlayingUI(playing) {
            els.label.style.animationPlayState = playing ? 'running' : 'paused';
            els.tonearm.style.transform = playing
                ? 'rotateZ(42deg) rotateX(-55deg)'
                : 'rotateZ(28deg) rotateX(-55deg)';
            els.playBtn.textContent = playing ? '暂停 (Pause)' : '播放 (Play)';
            els.progress.setAttribute('aria-valuenow', String(Math.round(progressRatio() * 100)));

            if (playing) {
                state.hasPlayed = true;
                setStatus('— Now Playing —', '#d4af37');
                startRhythm();
            } else {
                setStatus('— Paused —');
                stopRhythm();
            }
        }

        function progressRatio() {
            const duration = els.audio.duration;
            if (!Number.isFinite(duration) || duration <= 0) return 0;
            return Math.min(1, Math.max(0, els.audio.currentTime / duration));
        }

        function updateTime() {
            const track = state.tracks[state.current];
            const mediaDuration = els.audio.duration;
            const duration = Number.isFinite(mediaDuration) && mediaDuration > 0
                ? mediaDuration
                : (track && track.seconds ? track.seconds : 0);

            els.timeDisplay.textContent = `${fmt(els.audio.currentTime)} / ${fmt(duration)}`;
            const ratio = progressRatio();
            els.progressFill.style.width = `${ratio * 100}%`;
            els.progress.setAttribute('aria-valuenow', String(Math.round(ratio * 100)));
        }

        function updateMediaSession(track) {
            if (!('mediaSession' in navigator)) return;
            try {
                if ('MediaMetadata' in window) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: track.title,
                        artist: track.remote ? (track.artist || 'Mixkit') : (state.libraryName || 'Harmonia'),
                        album: 'Harmonia'
                    });
                }
                navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
                navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
                navigator.mediaSession.setActionHandler('play', () => startPlayback());
                navigator.mediaSession.setActionHandler('pause', () => els.audio.pause());
            } catch (err) {
                // 某些浏览器不支持全部 action，忽略即可
            }
        }

        function resetPlayback() {
            state.current = -1;
            state.history = [];
            state.deck = [];
            state.deckPos = -1;
            state.errorStreak = 0;

            els.audio.pause();
            els.audio.removeAttribute('src');
            try { els.audio.load(); } catch (err) { /* ignore */ }

            if (state.objectUrl) {
                URL.revokeObjectURL(state.objectUrl);
                state.objectUrl = null;
            }

            stopRhythm();
            stopPreload();
            els.songTitle.textContent = 'No Track Selected';
            els.timeDisplay.textContent = '0:00 / 0:00';
            els.progressFill.style.width = '0%';
            els.playBtn.textContent = '播放 (Play)';
            document.title = '黑金跃动留声机';
        }

        /* ---------------- 在线曲库 ---------------- */

        function initOnlineLibrary() {
            if (!ONLINE_LIBRARY.length) return;

            state.online = true;
            state.libraryName = '在线曲库';
            state.tracks = ONLINE_LIBRARY.map((item) => ({
                title: item.t,
                artist: item.a,
                url: item.u,
                seconds: item.d,
                bpm: 0,
                remote: true,
                path: item.u,
                broken: false
            }));

            renderLibrary();
            rebuildDeck();
            els.prevBtn.disabled = false;
            els.nextBtn.disabled = false;
            els.credit.hidden = false;

            setStatus(`— 在线曲库 · ${state.tracks.length} 首 —`);
            step(1);
        }

        /* ---------------- 载入本地音乐库 ---------------- */

        function loadLibrary(files, name) {
            const audioFiles = Array.from(files).filter((file) => AUDIO_RE.test(file.name));
            if (!audioFiles.length) {
                setStatus('— No Audio Found —');
                toast('这个文件夹里没有可播放的音频');
                return;
            }

            resetPlayback();
            state.online = false;
            state.hasPlayed = false;
            els.credit.hidden = true;

            state.libraryName = name || '音乐库';
            state.tracks = audioFiles
                .map((file) => ({
                    file,
                    path: filePath(file),
                    title: file.name.replace(/\.[^.]+$/, ''),
                    remote: false,
                    bpm: 100,
                    seconds: 0,
                    broken: false
                }))
                .sort((a, b) => a.path.localeCompare(b.path, 'zh-Hans-CN', { numeric: true, sensitivity: 'base' }));

            state.errorStreak = 0;
            renderLibrary();
            rebuildDeck();
            els.prevBtn.disabled = false;
            els.nextBtn.disabled = false;

            setStatus(`— ${state.libraryName} · ${state.tracks.length} 首 —`);
            toast(`已载入 ${state.tracks.length} 首，随机开始`);
            step(1);
        }

        /* ---------------- 事件绑定 ---------------- */

        els.folderInput.addEventListener('change', (event) => {
            const files = Array.from(event.target.files || []);
            event.target.value = '';
            if (!files.length) return;
            const first = files[0].webkitRelativePath || '';
            const folderName = first.split('/')[0] || '音乐库';
            loadLibrary(files, folderName);
        });

        els.playBtn.addEventListener('click', () => {
            if (!state.tracks.length) { promptLibrary(); return; }
            if (els.audio.paused) {
                if (state.current === -1) step(1);
                else startPlayback();
            } else {
                els.audio.pause();
            }
        });

        els.prevBtn.addEventListener('click', () => step(-1));
        els.nextBtn.addEventListener('click', () => step(1));

        function toggleShuffle() {
            state.shuffle = !state.shuffle;
            els.shuffleBtn.classList.toggle('on', state.shuffle);
            els.shuffleBtn.setAttribute('aria-pressed', String(state.shuffle));
            els.shuffleBtn.textContent = state.shuffle ? '随机 · 开' : '随机 · 关';
            if (state.shuffle) {
                if (state.tracks.length) rebuildDeck();
                toast('随机播放已开启');
            } else {
                toast('顺序播放已开启');
            }
        }

        els.shuffleBtn.addEventListener('click', toggleShuffle);

        els.audio.addEventListener('loadedmetadata', updateTime);
        els.audio.addEventListener('durationchange', updateTime);
        els.audio.addEventListener('timeupdate', updateTime);
        els.audio.addEventListener('progress', maybePreloadNext);
        els.audio.addEventListener('canplaythrough', maybePreloadNext);

        els.audio.addEventListener('play', () => setPlayingUI(true));
        els.audio.addEventListener('playing', () => {
            state.errorStreak = 0;
            setPlayingUI(true);
            maybePreloadNext();
        });
        els.audio.addEventListener('waiting', () => {
            if (state.current >= 0 && !els.audio.paused) setStatus('— 缓冲中 —');
        });
        els.audio.addEventListener('pause', () => {
            if (state.current >= 0) setPlayingUI(false);
        });
        els.audio.addEventListener('ended', () => {
            if (state.current >= 0) step(1);
        });
        els.audio.addEventListener('error', () => {
            if (state.current < 0 || !els.audio.getAttribute('src')) return;
            const track = state.tracks[state.current];
            if (track) track.broken = true;
            state.errorStreak += 1;

            if (state.errorStreak >= 3) {
                if (state.online) {
                    setStatus('— 网络不可用 · 可载入本地音乐 —');
                    toast('在线曲库加载失败，请检查网络，或选择本地音乐');
                    } else {
                    setStatus('— 没有可播放的音频 —');
                    toast('这些文件都无法播放，可能是浏览器不支持的格式');
                }
                return;
            }

            toast(`无法播放：${track ? track.title : '未知曲目'}`);
            setTimeout(() => {
                if (state.current >= 0) step(1);
            }, 600);
        });

        /* 首次交互：浏览器不允许自动出声，点一下任何地方就开始 */
        document.addEventListener('pointerdown', (event) => {
            if (state.hasPlayed || !state.tracks.length) return;
            const target = event.target;
            if (target && target.closest && target.closest('button, label, input, a, .track-item, .progress')) return;
            startPlayback();
        }, true);

        /* 进度条拖动 / 点击跳转 */
        function seekFromEvent(event) {
            const rect = els.progress.getBoundingClientRect();
            if (!rect.width) return;
            const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
            const duration = els.audio.duration;
            if (Number.isFinite(duration) && duration > 0) {
                els.audio.currentTime = ratio * duration;
                updateTime();
            }
        }

        els.progress.addEventListener('pointerdown', (event) => {
            if (!state.tracks.length) return;
            els.progress.setPointerCapture(event.pointerId);
            seekFromEvent(event);
            const onMove = (moveEvent) => seekFromEvent(moveEvent);
            const onUp = () => {
                els.progress.removeEventListener('pointermove', onMove);
                els.progress.removeEventListener('pointerup', onUp);
            };
            els.progress.addEventListener('pointermove', onMove);
            els.progress.addEventListener('pointerup', onUp);
        });

        /* 键盘快捷键 */
        document.addEventListener('keydown', (event) => {
            const target = event.target;
            if (target && target.closest && target.closest('input, button, label, textarea, select')) return;

            if (event.code === 'Space') {
                event.preventDefault();
                els.playBtn.click();
            } else if (event.key === 'ArrowRight') {
                event.preventDefault();
                els.nextBtn.click();
            } else if (event.key === 'ArrowLeft') {
                event.preventDefault();
                els.prevBtn.click();
            } else if (event.key === 's' || event.key === 'S') {
                event.preventDefault();
                toggleShuffle();
            }
        });

        /* 3D 视差交互 */
        let parallaxFrame = 0;
        let pointerX = 0;
        let pointerY = 0;

        document.addEventListener('mousemove', (event) => {
            pointerX = event.clientX;
            pointerY = event.clientY;
            if (parallaxFrame) return;
            parallaxFrame = requestAnimationFrame(() => {
                parallaxFrame = 0;
                const xAxis = (window.innerWidth / 2 - pointerX) / 30;
                const yAxis = (window.innerHeight / 2 - pointerY) / 30;
                els.scene.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
        });

        document.addEventListener('mouseleave', () => {
            els.scene.style.transform = 'rotateY(0deg) rotateX(0deg)';
        });

        /* ---------------- 拖入文件夹 ---------------- */

        let dragDepth = 0;

        function showVeil() { els.dropVeil.classList.add('show'); }
        function hideVeil() {
            dragDepth = 0;
            els.dropVeil.classList.remove('show');
        }

        window.addEventListener('dragenter', (event) => {
            event.preventDefault();
            dragDepth += 1;
            showVeil();
        });

        window.addEventListener('dragover', (event) => {
            event.preventDefault();
            if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
        });

        window.addEventListener('dragleave', (event) => {
            event.preventDefault();
            dragDepth = Math.max(0, dragDepth - 1);
            if (!dragDepth) els.dropVeil.classList.remove('show');
        });

        window.addEventListener('drop', async (event) => {
            event.preventDefault();
            hideVeil();

            const items = Array.from(event.dataTransfer && event.dataTransfer.items ? event.dataTransfer.items : []);
            const entries = items
                .map((item) => (item.webkitGetAsEntry ? item.webkitGetAsEntry() : null))
                .filter(Boolean);

            if (entries.length) {
                setStatus('— Reading Library —');
                const files = [];
                try {
                    await Promise.all(entries.map((entry) => walkEntry(entry, files)));
                } catch (err) {
                    console.warn('读取拖入的文件失败：', err);
                }
                if (files.length) {
                    const name = entries.length === 1 && entries[0].isDirectory
                        ? entries[0].name
                        : '拖入的唱片';
                    loadLibrary(files, name);
                } else {
                    setStatus('— No Audio Found —');
                    toast('拖入的内容里没有音频文件');
                }
                return;
            }

            const files = Array.from(event.dataTransfer ? event.dataTransfer.files : []);
            if (files.length) loadLibrary(files, '拖入的唱片');
        });

        function walkEntry(entry, out) {
            return new Promise((resolve) => {
                if (!entry) { resolve(); return; }
                if (entry.isFile) {
                    entry.file((file) => {
                        file._relativePath = entry.fullPath;
                        out.push(file);
                        resolve();
                    }, () => resolve());
                } else if (entry.isDirectory) {
                    const reader = entry.createReader();
                    const readBatch = () => {
                        reader.readEntries(async (batch) => {
                            if (!batch.length) { resolve(); return; }
                            await Promise.all(batch.map((child) => walkEntry(child, out)));
                            readBatch();
                        }, () => resolve());
                    };
                    readBatch();
                } else {
                    resolve();
                }
            });
        }

        /* ---------------- 对外接口（方便以后换曲库） ---------------- */

        window.Harmonia = {
            loadFiles(files, name) {
                loadLibrary(Array.from(files), name);
            },
            next() { step(1); },
            prev() { step(-1); },
            toggleShuffle,
            get library() { return state.tracks.map((track) => track.path); }
        };

        initOnlineLibrary();
    })();
    </script>

</body>
</html>
